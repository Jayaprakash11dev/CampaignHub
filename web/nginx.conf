server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API requests go to the api container (service name from docker-compose).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Vite puts a content hash in asset file names, so they can be cached
  # for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths (e.g. /posts/12 on refresh) get
  # index.html and React Router takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
